services:
  ff-pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: ${FF_PG_PASSWORD}
      POSTGRES_DB: fantasy_football
    volumes:
      - ff-pg-data:/var/lib/postgresql/data
      # In-place upgrade: mount the existing data directory here at cutover
      # - ~/src/zc-fantasy-football/ff-pg/pg-data:/var/lib/postgresql/data
    networks:
      - homelab-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_football"]
      interval: 10s
      timeout: 5s
      retries: 5

  ff-engine:
    build: .
    # image: ghcr.io/markis/fantasy-football-engine:latest
    ports:
      - "3102:3100"
    # Hard cap for the container; GOMEMLIMIT (soft limit, Go-runtime native)
    # sits just below it so the GC tightens before the kernel OOM-kill does.
    mem_limit: 1g
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ff-corpus:/data/corpus
    environment:
      FF_PG_PASSWORD: ${FF_PG_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FF_GITHUB_PAT: ${FF_GITHUB_PAT:-}
      FF_SECRETS_DIR: /run/secrets
      GOMEMLIMIT: 900MiB
    secrets:
      - llm-api-key
      - fantasypros-api
      - fantasypros-cookies
      - fantasy-github-pat
    depends_on:
      ff-pg:
        condition: service_healthy
    networks:
      - homelab-shared
    restart: unless-stopped

volumes:
  ff-pg-data:
  ff-corpus:

networks:
  homelab-shared:
    external: true

secrets:
  llm-api-key:
    file: ./secrets/llm-api-key
  fantasypros-api:
    file: ./secrets/fantasypros-api
  fantasypros-cookies:
    file: ./secrets/fantasypros-cookies
  fantasy-github-pat:
    file: ./secrets/fantasy-github-pat
---
name: "lint"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Use the toolchain from go.mod, not "stable": the pinned
          # golangci-lint binary is built with go1.26 and panics
          # ("file requires newer Go version") when forced to type-check
          # a newer stdlib.
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to the same version used locally to keep CI and dev in sync.
          version: v2.12.2

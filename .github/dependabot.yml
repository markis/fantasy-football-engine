version: 2

# PR titles follow Conventional Commits and are chosen to work with the
# release automation in .github/workflows/docker.yml:
# - Go module + Containerfile changes ship in the binary -> fix(deps) ->
#   every merged bump is a patch release (vX.Y.(Z+1) image tag).
# - GitHub Actions bumps are build infra -> chore(deps) -> no release.
updates:
  # Go module dependencies (go.mod / go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"

  # GitHub Actions pinned in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Base images pinned in the root Containerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"